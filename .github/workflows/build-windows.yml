name: Build StrafeHelper Safe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout safe build files
        uses: actions/checkout@v4

      - name: Fetch exact original StrafeHelper source
        shell: pwsh
        run: |
          git clone https://github.com/fL0P1337/StrafeHelper.git upstream
          git -C upstream checkout --detach 6da4c6238042a572ad18e78b752d18dc3f0c51f4

      - name: Apply and validate safe backend patch
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\safe-patch.py" "$env:GITHUB_WORKSPACE\upstream"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild "$env:GITHUB_WORKSPACE\upstream\StrafeHelper.vcxproj" /m /p:Configuration=Release /p:Platform=x64
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\upstream" -Recurse -Filter "StrafeHelper.exe" -File |
            Where-Object { $_.FullName -match "Release" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            throw "MSBuild completed without producing StrafeHelper.exe"
          }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\dist\StrafeHelper.exe" -Force

      - name: Verify final EXE safety boundary
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\dist\StrafeHelper.exe"
          if (-not (Test-Path $exe)) { throw "Final EXE is missing" }
          $imports = (& dumpbin /imports $exe | Out-String)
          if ($imports -match '\bSendInput\b') {
            throw "Safety verification failed: final EXE imports SendInput"
          }
          if ($imports -match '(?i)interception(64)?\.dll') {
            throw "Safety verification failed: final EXE imports Interception DLL"
          }
          Write-Host "Final EXE verified: no SendInput import and no Interception DLL import."
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload ready EXE
        uses: actions/upload-artifact@v4
        with:
          name: StrafeHelper-Safe-Windows-x64
          path: dist/StrafeHelper.exe
          if-no-files-found: error
          retention-days: 30

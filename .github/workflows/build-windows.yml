name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 Release
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /O2 /EHsc /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN main.cpp /Fe:StrafeHelper.exe /link user32.lib gdi32.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: StrafeHelper-Windows-x64
          path: StrafeHelper.exe
          if-no-files-found: error

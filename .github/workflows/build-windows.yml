name: Build StrafeHelper Safe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout safe build files
        uses: actions/checkout@v4

      - name: Fetch exact original StrafeHelper source
        shell: pwsh
        run: |
          git clone https://github.com/fL0P1337/StrafeHelper.git upstream
          git -C upstream checkout --detach 6da4c6238042a572ad18e78b752d18dc3f0c51f4

      - name: Apply and validate safe backend patch
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\safe-patch.py" "$env:GITHUB_WORKSPACE\upstream"

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Visual Studio toolchain
        shell: pwsh
        run: |
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          $msbuild = Get-Command MSBuild.exe -ErrorAction SilentlyContinue
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe not available after MSVC setup" }
          if (-not $msbuild) { throw "MSBuild.exe not available after MSVC setup" }
          if (-not $dumpbin) { throw "dumpbin.exe not available after MSVC setup" }

          "MSBUILD=$($msbuild.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DUMPBIN=$($dumpbin.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "cl: $($cl.Source)"
          Write-Host "MSBuild: $($msbuild.Source)"
          Write-Host "dumpbin: $($dumpbin.Source)"

      - name: Build Release x64
        shell: pwsh
        run: |
          & "$env:MSBUILD" "$env:GITHUB_WORKSPACE\upstream\StrafeHelper.vcxproj" /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\upstream" -Recurse -Filter "StrafeHelper.exe" -File |
            Where-Object { $_.FullName -match "Release" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "MSBuild completed without producing StrafeHelper.exe" }

          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\dist\StrafeHelper.exe" -Force
          Write-Host "Built: $($exe.FullName)"

      - name: Verify final EXE safety boundary
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\dist\StrafeHelper.exe"
          if (-not (Test-Path $exe)) { throw "Final EXE is missing" }

          $imports = (& "$env:DUMPBIN" /imports $exe | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          if ($imports -match '\bSendInput\b') {
            throw "Safety verification failed: final EXE imports SendInput"
          }
          if ($imports -match '(?i)interception(64)?\.dll') {
            throw "Safety verification failed: final EXE imports Interception DLL"
          }

          Write-Host "Final EXE verified: no SendInput import and no Interception DLL import."
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload ready EXE
        uses: actions/upload-artifact@v4
        with:
          name: StrafeHelper-Safe-Windows-x64
          path: dist/StrafeHelper.exe
          if-no-files-found: error
          retention-days: 30
